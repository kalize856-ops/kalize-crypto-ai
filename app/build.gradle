plugins {
    id 'com.android.application'
}

android {
    namespace 'com.kalize.cryptoai'
    compileSdk 35

    defaultConfig {
        applicationId 'com.kalize.cryptoai'
        minSdk 19
        targetSdk 28
        versionCode 7
        versionName '0.1.7'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    implementation 'com.squareup.okhttp3:okhttp:3.12.13'
}
