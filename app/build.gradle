plugins {
    id 'com.android.application'
}

android {
    namespace 'com.kalize.cryptoai'
    compileSdk 35

    defaultConfig {
        applicationId 'com.kalize.cryptoai'
        minSdk 19
        targetSdk 28
        versionCode 3
        versionName '0.1.2'
    }

    dependencies {\n        implementation 'com.squareup.okhttp3:okhttp:3.12.13'\n    }\n\n    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}
