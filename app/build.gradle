plugins {
    id 'com.android.application'
}

android {
    namespace 'com.kalize.cryptoai'
    compileSdk 35

    defaultConfig {
        applicationId 'com.kalize.cryptoai'
        minSdk 19
        targetSdk 28
        versionCode 3
        versionName '0.1.2'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}
